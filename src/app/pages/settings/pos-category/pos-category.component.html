<div class="bg-slate-50 min-h-screen p-6">
  <div class="bg-white m-0 p-0 text-[#1e293b] text-[15px] rounded-10 relative mb-[25px] shadow-sm border border-[#e2e8f0]">
    
    <!-- Header -->
    <div class="py-[16px] px-[25px] font-medium text-[17px] border-b border-[#e2e8f0] flex items-center justify-between flex-wrap gap-y-4">
      <div class="flex items-center gap-3">
        <h4 class="mb-0 text-lg font-bold text-[#0B3B60]">
          Category Setup
        </h4>
      </div>
    </div>

    <div class="p-[25px]">
      
      <!-- Category Form Section -->

  <div class="mb-8">

    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">

      <nz-form-item class="mb-0">

        <div nz-row [nzGutter]="[20, 4]" class="w-full">

          <!-- ================= CATEGORY NAME ================= -->
          <div nz-col nzXs="24" nzSm="12" nzMd="8">

            <nz-form-control
              class="mb-[10px]"
              nzErrorTip="Category Name is required!"
            >

              <nz-form-label
                nzRequired
                nzFor="categoryName"
                class="flex items-center
                      [&>label]:text-dark
                      [&>label]:dark:text-white/60
                      mb-[10px] p-0
                      text-[15px] capitalize"
              >
                Category Name
              </nz-form-label>

              <input
                nz-input
                formControlName="categoryName"
                id="categoryName"
                placeholder="Enter category name"
                class="w-full rounded-6 border-normal border-1
                      text-[15px]
                      dark:bg-white/10
                      dark:border-white/10
                      px-[20px] py-[12px]
                      min-h-[50px]
                      outline-none
                      placeholder:text-[#A0A0A0]
                      text-theme-gray
                      dark:text-white/60"
              />

            </nz-form-control>

          </div>

          <!-- ================= STATUS ================= -->
          <div nz-col nzXs="24" nzSm="12" nzMd="8">

            <nz-form-control class="mb-[10px]">

              <nz-form-label
                nzFor="isActive"
                class="flex items-center
                      [&>label]:text-dark
                      [&>label]:dark:text-white/60
                      mb-[10px] p-0
                      text-[15px] capitalize"
              >
                Status
              </nz-form-label>

              <div class="flex items-center min-h-[50px]">

                <nz-switch
                  formControlName="isActive"
                  nzCheckedChildren="Active"
                  nzUnCheckedChildren="Inactive"
                >
                </nz-switch>

              </div>

            </nz-form-control>

          </div>

        </div>

      </nz-form-item>


      <!-- ================= BUTTONS ================= -->
      <div
        class="flex flex-col sm:flex-row sm:justify-end
              gap-3 pt-4 mt-4
              border-t border-[#e2e8f0]"
      >

        <button
          type="button"
          nz-button
          (click)="resetForm()"
          class="w-full sm:w-auto
                rounded-[6px] h-10 px-6
                font-semibold
                border-[#cbd5e1]
                text-[#64748b]
                hover:border-[#0B3B60]
                hover:text-[#0B3B60]"
        >
          Reset
        </button>


        <button
          type="submit"
          nz-button
          class="w-full sm:w-auto
                text-white text-[14px]
                font-semibold
                h-10 px-8
                rounded-[6px]
                border-none
                shadow-sm
                transition-all duration-300"
          style="background: linear-gradient(135deg, #0B3B60 0%, #28C76F 100%);"
        >
          Save Category
        </button>

      </div>

    </form>

  </div>


      <!-- Category List Section -->
      <div>
        <h5 class="text-[14px] font-bold text-[#0B3B60] uppercase tracking-wider mb-4 border-b border-[#e2e8f0] pb-2">
          Category List
        </h5>

        <div class="w-full overflow-x-auto">
          <nz-table #categoryTable [nzData]="categoryList" [nzPageSize]="10" [nzLoading]="isLoading">
            <thead>
              <tr>
                <th class="px-[20px] py-[12px] text-start text-[#0B3B60] text-[14px] font-bold border-b border-[#e2e8f0] uppercase bg-[#f8fafc]">SL</th>
                <th class="px-[20px] py-[12px] text-start text-[#0B3B60] text-[14px] font-bold border-b border-[#e2e8f0] uppercase bg-[#f8fafc]">Category Name</th>
                <th class="px-[20px] py-[12px] text-center text-[#0B3B60] text-[14px] font-bold border-b border-[#e2e8f0] uppercase bg-[#f8fafc]">Status</th>
                <th class="px-[20px] py-[12px] text-center text-[#0B3B60] text-[14px] font-bold border-b border-[#e2e8f0] uppercase bg-[#f8fafc]">Action</th>
              </tr>
            </thead>
            <tbody>
              @for (data of categoryTable.data; track data.id; let i = $index) {
                <tr class="border-b border-[#f1f5f9]">
                  <td class="px-[20px] py-3 text-[#0B3B60] font-medium">{{ i + 1 }}</td>
                  <td class="px-[20px] py-3 text-[#0B3B60] font-bold">{{ data.name || data.categoryName }}</td>
                  <td class="px-[20px] py-3 text-center">
                    <span [ngClass]="data.isActive ? 'badge-approve' : 'badge-reject'">
                      {{ data.isActive ? 'Active' : 'Inactive' }}
                    </span>
                  </td>
                  <td class="px-[20px] py-3 text-center">
                    <div class="flex items-center justify-center gap-2">
                      <button 
                        type="button" 
                        nz-button 
                        nzType="default" 
                        nzShape="circle"
                        class="border-[#cbd5e1] text-[#0B3B60] hover:border-[#0B3B60] hover:bg-[#0B3B60] hover:text-white transition-colors duration-200"
                        (click)="editCategory(data)">
                        <i nz-icon nzType="edit"></i>
                      </button>

                      <button 
                        type="button" 
                        nz-button 
                        nzType="default" 
                        nzShape="circle"
                        class="border-[#cbd5e1] text-[#ef4444] hover:border-[#ef4444] hover:bg-[#ef4444] hover:text-white transition-colors duration-200"
                        (click)="deleteCategory(data.id)">
                        <i nz-icon nzType="delete"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              }
            </tbody>
          </nz-table>
        </div>
      </div>

    </div>
  </div>
</div>
